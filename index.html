<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d81324" />
  <meta name="description" content="OSAKA Happy Journey — Japan trip planner 26 Sep–1 Oct 2026" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <title>OSAKA Happy Journey 🇯🇵</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">V4 FREE • 26 SEP — 1 OCT 2026</p>
      <h1>OSAKA Happy Journey <span>🇯🇵</span></h1>
    </div>
    <button id="installBtn" class="ghost hidden">＋ Add to Home</button>
  </header>

  <main id="app">
    <section id="homeView" class="view active"></section>
    <section id="tripView" class="view"></section>
    <section id="freeView" class="view"></section>
    <section id="savedView" class="view"></section>
    <section id="phraseView" class="view"></section>
    <section id="mapView" class="view"></section>
    <section id="moreView" class="view"></section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-view="homeView" class="nav-btn active"><span>●</span><small>Today</small></button>
    <button data-view="tripView" class="nav-btn"><span>旅</span><small>Trip</small></button>
    <button data-view="freeView" class="nav-btn"><span>＋</span><small>Free Day</small></button>
    <button data-view="savedView" class="nav-btn"><span>★</span><small>Saved</small></button>
    <button data-view="phraseView" class="nav-btn"><span>あ</span><small>Japanese</small></button>
    <button data-view="mapView" class="nav-btn"><span>⌖</span><small>Map</small></button>
    <button data-view="moreView" class="nav-btn"><span>•••</span><small>More</small></button>
  </nav>

  <dialog id="plannerDialog">
    <form method="dialog" id="plannerForm">
      <div class="dialog-head"><h3>เพิ่มสถานที่</h3><button value="cancel" class="icon-btn">✕</button></div>
      <label>ชื่อสถานที่<input id="placeName" required placeholder="เช่น HARBS Umeda" /></label>
      <label>เวลา<input id="placeTime" type="time" value="13:00" /></label>
      <label>Google Maps URL<input id="placeUrl" type="url" placeholder="https://maps.google.com/..." /></label>
      <label>โน้ต<textarea id="placeNote" rows="3" placeholder="เมนูที่อยากกิน / สิ่งที่อยากทำ"></textarea></label>
      <button class="primary" value="default">เพิ่มเข้าแพลน</button>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js" defer></script>
</body>
</html>
